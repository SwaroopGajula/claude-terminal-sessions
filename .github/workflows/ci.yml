name: CI

# Every push and pull request: check, test and build the .vsix.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check syntax
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build .vsix
        run: npm run package

      - name: Upload .vsix
        uses: actions/upload-artifact@v4
        with:
          name: claude-terminal-sessions-vsix
          path: "*.vsix"
          retention-days: 30
