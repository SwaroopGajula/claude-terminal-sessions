<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E08A62"/>
      <stop offset="1" stop-color="#B24E2C"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2724"/>
      <stop offset="1" stop-color="#1A1816"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5A2210" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- stacked session cards behind -->
  <rect x="58" y="40" width="152" height="120" rx="16" fill="#FFFFFF" opacity="0.18"/>
  <rect x="48" y="52" width="164" height="128" rx="17" fill="#FFFFFF" opacity="0.28"/>
  <!-- terminal window -->
  <g filter="url(#sh)">
    <rect x="36" y="66" width="184" height="150" rx="18" fill="url(#win)"/>
    <path d="M54 66h148a18 18 0 0 1 18 18v6H36v-6a18 18 0 0 1 18-18z" fill="#3A3631"/>
    <circle cx="58" cy="78" r="5" fill="#F0705C"/>
    <circle cx="75" cy="78" r="5" fill="#F2B84B"/>
    <circle cx="92" cy="78" r="5" fill="#6BC37A"/>
  </g>
  <!-- prompt chevron and cursor -->
  <path d="M60 116l22 18-22 18" fill="none" stroke="#F4A27F" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="96" y="144" width="40" height="11" rx="5.5" fill="#F4EDE6"/>
  <!-- session history lines -->
  <rect x="60" y="174" width="96" height="8" rx="4" fill="#F4EDE6" opacity="0.35"/>
  <rect x="60" y="192" width="64" height="8" rx="4" fill="#F4EDE6" opacity="0.22"/>
  <!-- resume badge -->
  <circle cx="190" cy="186" r="30" fill="#F4EDE6"/>
  <path d="M181 170.5v31l25-15.5z" fill="#B24E2C"/>
</svg>
