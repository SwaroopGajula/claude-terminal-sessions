name: Release

# Push a tag like v0.4.1 (matching "version" in package.json) to:
#   1. test and build the .vsix
#   2. create a GitHub Release with the .vsix attached
#   3. publish to the VS Code Marketplace using Trusted Publishing (no token needed;
#      requires the Trusted Publishing policy for this repo + release.yml on the
#      Marketplace publisher page)
#   4. publish to Open VSX using Trusted Publishing (no token needed; requires a trusted
#      publisher for this repo + release.yml at open-vsx.org/user-settings/trusted-publishers)
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # needed to create the GitHub Release
  id-token: write # needed for Trusted Publishing (OIDC) on the Marketplace and Open VSX

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION. Bump the version or fix the tag."
            exit 1
          fi

      - name: Check syntax
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build .vsix
        run: npm run package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VSIX=$(ls *.vsix)
          NOTES=$(awk -v v="## ${GITHUB_REF_NAME#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          if [ -z "$NOTES" ]; then NOTES="See CHANGELOG.md"; fi
          # Re-running a release skips steps that already succeeded.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "Release $GITHUB_REF_NAME already exists"; exit 0; fi
          gh release create "$GITHUB_REF_NAME" "$VSIX" \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTES

          **Install:** search **Claude Terminal Sessions** in the VS Code Extensions panel, or download \`$VSIX\` below and run
          \`code --install-extension $VSIX\`"

      - name: Publish to VS Code Marketplace (Trusted Publishing)
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --skip-duplicate --packagePath *.vsix

      # No OVSX_PAT here on purpose: a stored token would override trusted publishing.
      - name: Publish to Open VSX (Trusted Publishing)
        run: npx --yes ovsx@1.3.0 publish *.vsix --trusted-publishing --skip-duplicate
